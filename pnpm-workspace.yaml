catalog:
  '@antfu/eslint-config': 10.0.0
  '@astrojs/check': 0.9.12
  '@astrojs/vue': 7.1.6
  '@playwright/test': 1.65.1
  '@portabletext/to-html': 6.0.0
  '@portabletext/types': 4.0.2
  '@sanity/client': 8.17.0
  '@sanity/image-url': 2.2.0
  '@testing-library/dom': 10.4.2
  '@testing-library/jest-dom': 7.0.1
  '@testing-library/user-event': 14.6.13
  '@vitest/coverage-v8': 5.1.1
  astro: 7.4.13
  eslint: 10.15.0
  eslint-plugin-astro: 3.2.1
  eslint-plugin-playwright: 2.12.2
  eslint-plugin-testing-library: 7.16.3
  groq: 6.24.0
  happy-dom: 21.0.4
  lighthouse: 13.6.0
  msw: 3.0.7
  netlify-cli: 27.16.3
  playwright: 1.65.1
  typescript: 6.0.3
  vitest: 5.1.1
  vue: 3.5.46

allowBuilds:
