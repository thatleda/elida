trustPolicy: no-downgrade
shellEmulator: true
minimumReleaseAge: 1440
minimumReleaseAgeExcludePrune: true

trustPolicyExclude:
  - chokidar@4.0.3
  - semver@6.3.1
  - why-is-node-running@3.2.2
  - '@netlify/serverless-functions-api'

packages:
  - .

catalog:
  '@antfu/eslint-config': 9.5.1
  '@astrojs/check': 0.9.11
  '@astrojs/vue': 7.1.1
  '@playwright/test': 1.64.1
  '@portabletext/to-html': 6.0.0
  '@portabletext/types': 4.0.2
  '@sanity/client': 8.9.0
  '@sanity/image-url': 2.1.1
  '@testing-library/dom': 10.4.2
  '@testing-library/jest-dom': 7.0.1
  '@testing-library/user-event': 14.6.8
  '@vitest/coverage-v8': 5.0.5
  astro: 7.4.1
  eslint: 10.12.0
  eslint-plugin-astro: 3.2.1
  eslint-plugin-playwright: 2.12.1
  eslint-plugin-testing-library: 7.16.2
  groq: 6.20.0
  happy-dom: 21.0.3
  lighthouse: 13.5.0
  msw: 3.0.3
  netlify-cli: 27.12.1
  playwright: 1.64.1
  typescript: 5.9.3
  vitest: 5.0.5
  vue: 3.5.44

allowBuilds:
  esbuild: true
  msw: true
  netlify-cli: true
  sharp: true
  unix-dgram: true

minimumReleaseAgeExclude:
  - '@netlify/edge-bundler@16.1.1'
