name: Pull Request CI

on: pull_request

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write
  pages: write
  id-token: write

jobs:
  preview:
    name: Build, Deploy & Audit
    runs-on: ubuntu-latest
    environment:
      name: development
      url: https://pr-${{ github.event.pull_request.number }}--vuelfden.netlify.app
    env:
      PUBLIC_SANITY_PROJECT_ID: ${{ secrets.PUBLIC_SANITY_PROJECT_ID }}
      PUBLIC_SANITY_DATASET: ${{ secrets.PUBLIC_SANITY_DATASET }}
      HARDCOVER_API_KEY: ${{ secrets.HARDCOVER_API_KEY }}
      NETLIFY_URL: https://pr-${{ github.event.pull_request.number }}--vuelfden.netlify.app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          cache: true
          cache_dependency_path: pnpm-lock.yaml
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: lts/*
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        run: |
          if [ "${{ github.actor }}" = "dependabot[bot]" ]; then
            pnpm install --no-frozen-lockfile
          else
            pnpm install --frozen-lockfile
          fi
      - name: Commit lockfile fix (Dependabot only)
        if: github.actor == 'dependabot[bot]'
        env:
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          if ! git diff --quiet -- pnpm-lock.yaml; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add pnpm-lock.yaml
            git commit -m "chore: regenerate lockfile for pnpm catalog compatibility"
            git push origin "HEAD:${PR_HEAD_REF}"
          fi
      - name: Run linter & tests in parallel
        run: |
          pnpm run lint:ci &
          LINT_PID=$!
          pnpm run test &
          TEST_PID=$!
          wait $LINT_PID
          wait $TEST_PID
      - name: Build production bundle
        run: pnpm run build
      - name: Deploy preview
        id: deploy
        run: |
          ALIAS="pr-${{ github.event.pull_request.number }}"
          pnpm run deploy --alias "${ALIAS}" --site ${{ secrets.NETLIFY_SITE_ID }} --auth ${{ secrets.NETLIFY_TOKEN }} --message "Deploying PR #${{ github.event.pull_request.number }}"
      - run: echo "Published preview at ${{ env.NETLIFY_URL }}" >> $GITHUB_STEP_SUMMARY
      - name: Install Playwright browsers
        run: pnpm exec playwright install chromium --with-deps
      - name: Run E2E tests
        run: pnpm run test:e2e
        continue-on-error: true
      - name: Run Lighthouse audits
        run: pnpm run lighthouse
        continue-on-error: true
      - name: Upload Playwright report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
      - name: Upload Lighthouse reports
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: lighthouse-reports
          path: |
            lighthouse-*.html
            lighthouse-*.json
            lighthouse-summary.md
          retention-days: 30
      - name: Prepare reports for GitHub Pages
        if: always()
        run: |
          mkdir -p _site
          cp -r playwright-report _site/playwright 2>/dev/null || true
          cp lighthouse-index.html _site/index.html 2>/dev/null || true
          cp lighthouse-*.html lighthouse-*.json _site/ 2>/dev/null || true
      - name: Upload reports to GitHub Pages
        if: always()
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
      - name: Deploy to GitHub Pages
        if: always()
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346
        id: deployment
      - name: Read Lighthouse summary
        if: always()
        id: lighthouse
        run: |
          if [ -f lighthouse-summary.md ]; then
            echo "SUMMARY<<EOF" >> $GITHUB_OUTPUT
            cat lighthouse-summary.md >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          fi
        continue-on-error: true
      - name: Comment PR with results
        if: always()
        uses: thollander/actions-comment-pull-request@24bffb9b452ba05a4f3f77933840a6a841d1b32b
        with:
          comment-tag: execution
          message: |
            ### Test Results
            Preview deployed to ${{ env.NETLIFY_URL }}

            **[View Lighthouse Reports](${{ steps.deployment.outputs.page_url }})** | **[View Playwright Reports](${{ steps.deployment.outputs.page_url }}playwright)**

            #### Lighthouse Audits
            ${{ steps.lighthouse.outputs.SUMMARY || 'Lighthouse audit results are available above.' }}
